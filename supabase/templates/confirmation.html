<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f2933;">
    <div style="max-width:420px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;">
      <h2 style="margin:0 0 12px;font-size:20px;">Your Trips verification code</h2>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.5;">Use this 6-digit code to finish creating your account:</p>
      <p style="margin:0 0 20px;font-size:36px;font-weight:700;letter-spacing:8px;text-align:center;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</p>
      <p style="margin:0;font-size:13px;line-height:1.5;color:#6b7280;">Enter this code on the Trips screen where you asked for it. It works once and expires in one hour. If you did not request it, you can ignore this email.</p>
    </div>
  </body>
</html>
